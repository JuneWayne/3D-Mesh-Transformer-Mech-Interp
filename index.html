<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Head Replacement for Efficient Mesh Generation</title>
<style>
  :root { --bg: #fbfbfa; --ink: #17191c; --mute: #6b7078; --line: #d6d9dd; --accent: #2346d6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121315; --ink: #eceef0; --mute: #9399a1; --line: #3b3f45; --accent: #8ea2ff; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; padding: 8px 16px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 16px; font-weight: 600; flex: 1 1 auto; }
  h1 span { color: var(--mute); font-weight: 400; }
  a, button { color: var(--accent); font: inherit; }
  button { background: none; border: 1px solid var(--line); border-radius: 4px; padding: 3px 10px; cursor: pointer; }
  iframe { flex: 1 1 auto; width: 100%; border: 0; display: block; background: #525659; }
</style>
</head>
<body>
<header>
  <h1>Head Replacement for Efficient Mesh Generation <span>· Ethan Cao, University of Virginia</span></h1>
  <a href="slides/preliminary-findings.pdf" download>Download PDF</a>
  <a href="https://github.com/JuneWayne/3D-Mesh-Transformer-Mech-Interp">Code</a>
  <button id="fs" type="button">Full screen</button>
</header>
<iframe id="deck" title="Slides" allowfullscreen src="slides/preliminary-findings.pdf#view=Fit&amp;pagemode=none"></iframe>
<script>
  document.getElementById('fs').onclick = function () {
    var d = document.getElementById('deck');
    (d.requestFullscreen || d.webkitRequestFullscreen || function () {}).call(d);
  };
</script>
</body>
</html>
